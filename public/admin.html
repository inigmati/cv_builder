<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav><a href="index.html">Home</a> | <a href="about.html">About Me</a> | <a href="skills.html">Skills</a> | <a href="links.html">Links</a> | <a href="contact.html">Contact</a> | <a href="achievements.html">Achievements</a></nav>
    <div class="container">
        <h1>Admin Panel</h1>
        
        <h2>Edit Pages</h2>
        <form id="updateForm">
            <p><label>Home: <textarea id="home" name="home"></textarea></label></p>
            <p><label>About Me: <textarea id="about" name="about"></textarea></label></p>
            <p><label>Skills: <textarea id="skills" name="skills"></textarea></label></p>
            <p><label>Links: <textarea id="links" name="links"></textarea></label></p>
            <p><label>Contact: <textarea id="contact" name="contact"></textarea></label></p>
            <p><label>Achievements: <textarea id="achievements" name="achievements"></textarea></label></p>
            <p><button type="submit">Save Changes</button></p>
        </form>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch("/get-content")
                .then(response => response.json())
                .then(data => {
                    Object.keys(data).forEach(key => {
                        document.getElementById(key).value = data[key];
                    });
                });

            document.getElementById("updateForm").addEventListener("submit", function(event) {
                event.preventDefault();
                const formData = {};
                new FormData(this).forEach((value, key) => formData[key] = value);
                fetch("/update", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData)
                }).then(response => response.json()).then(data => {
                    alert(data.message);
                });
            });
        });
    </script>
</body>
</html>
